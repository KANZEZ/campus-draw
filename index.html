<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Draw</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <form id="student-form" novalidate>
      <input id="student-id" name="studentId" aria-label="Student ID" aria-describedby="notice" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]{8}" placeholder="Student ID" required>
      <button id="submit" type="submit">Assign</button>
    </form>
    <div class="map">
      <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1792" role="img" aria-labelledby="map-title map-description">
        <title id="map-title">PolyU campus map</title>
        <desc id="map-description">Assigned region</desc>
        <image id="map-image" href="./campus-map.svg" width="2048" height="1792"/>
        <g id="map-pin" visibility="hidden" aria-hidden="true">
          <circle class="pin-halo" r="40"/>
          <path class="pin-shape" d="M0,0 C-8,-14 -29,-35 -29,-53 A29,29 0 1,1 29,-53 C29,-35 8,-14 0,0Z"/>
          <circle class="pin-centre" cx="0" cy="-53" r="10"/>
        </g>
      </svg>
    </div>
    <section class="result" aria-labelledby="result-heading">
      <div class="region">
        <h1 id="result-heading">Assigned region</h1>
        <p id="location-name" aria-live="polite">—</p>
        <p id="notice" class="sr-only" role="status" aria-live="polite"></p>
      </div>
      <div class="actions">
        <a id="official-map" href="https://www.polyu.edu.hk/campus-map/" target="_blank" rel="noopener noreferrer" title="Map © The Hong Kong Polytechnic University">Open official map</a>
        <button id="receipt" type="button" disabled>Receipt</button>
      </div>
    </section>
  </main>
</body>
</html>
